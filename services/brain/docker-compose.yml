# Sallie Brain — local development stack.
# Phase 1: just the brain. Phases 3+ add qdrant, ollama, knowledge service.
# Run from this directory:  docker-compose up

services:
  brain:
    build: .
    image: sallie-brain:dev
    container_name: sallie-brain
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO
      BRAIN_HOST: 0.0.0.0
      BRAIN_PORT: "8000"
      # OLLAMA_BASE_URL: http://ollama:11434   # uncomment in Phase 3
    restart: unless-stopped


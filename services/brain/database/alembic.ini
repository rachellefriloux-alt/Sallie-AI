# Sallie Brain — Alembic configuration.
#
# This file is intentionally minimal. The real configuration lives in
# ``database/alembic/env.py`` so that:
#
# * the database URL comes from ``DATABASE_URL`` (or, as a fallback,
#   from ``app.config.settings.database_url``) — never hardcoded here,
# * the script_location is resolved relative to this ini file rather
#   than the current working directory, so ``alembic`` works the same
#   from the repo root, ``services/brain/``, or inside the Docker image.
#
# Run from anywhere with:
#
#     alembic -c services/brain/database/alembic.ini upgrade head
#
# or, if you cd into ``services/brain/database/`` first:
#
#     alembic upgrade head

[alembic]
# Path to migration scripts. ``%(here)s`` resolves to the directory of
# this ini file so ``alembic`` works from any cwd (repo root, brain dir,
# inside Docker — all behave the same).
script_location = %(here)s/alembic

# Don't put a date prefix on revision filenames — we order by the
# 3-digit ordinal in the slug instead (``001_``, ``002_``, …) to match
# the SQL migration naming convention in ``migrations/``.
file_template = %%(rev)s_%%(slug)s

# Timezone for any timestamp columns Alembic itself writes
# (``alembic_version`` doesn't have any, but autogenerate may).
timezone = UTC

# sqlalchemy.url is intentionally **omitted**. ``env.py`` resolves it
# from ``DATABASE_URL`` so we don't risk committing credentials.

# Logging — keep it quiet by default; bump via ``--log-level`` when
# debugging a migration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

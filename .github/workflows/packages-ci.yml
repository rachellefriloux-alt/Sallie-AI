# Packages CI — typechecks every package under packages/* that we own
# (i.e. has a tsconfig.json *and* at least one .ts file under src/).
#
# Phase 0.7 of the build plan. Closes the loop on Phase 0.6: each
# Phase-0.6 scaffolded package has a tsconfig that extends
# tsconfig.base.json, so the strict quality bar (ADR 0005) is enforced
# on every PR.
#
# Empty packages (those still scaffolded with only a README + Sources-to-merge
# map and no src/) are skipped — they will start being typechecked
# automatically as soon as a .ts file is added to their src/ directory.

name: packages-ci

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "tsconfig.base.json"
      - ".github/workflows/packages-ci.yml"
  pull_request:
    paths:
      - "packages/**"
      - "tsconfig.base.json"
      - ".github/workflows/packages-ci.yml"

concurrency:
  group: packages-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # We don't run a full pnpm install because the legacy host repo
      # still uses npm and many of the older packages/ entries (ai-models,
      # common, features, ui, etc.) carry historical baggage that would
      # need their own clean-up PR. Instead we install only the typescript
      # compiler globally — every Phase-0.6 package's tsconfig already
      # extends ../../tsconfig.base.json, so a single tsc invocation per
      # package is enough.
      - name: Install TypeScript
        run: npm install --global typescript@5.5.4

      - name: Typecheck each owned Phase-0.6 package
        # Explicit allow-list — only the packages whose tsconfigs were
        # authored as part of Phase 0.6 and extend the strict
        # tsconfig.base.json. Legacy packages (ai-models, common,
        # features, persona, ui, etc.) carry historical baggage
        # (Expo/RN/Jest type deps, deprecated configs) that needs its
        # own clean-up PR before they can be added to this allow-list.
        #
        # As Phase 1.5+ ports populate convergence/, core/, emotions/,
        # they will start being typechecked automatically once they
        # have at least one .ts file under src/.
        run: |
          set -e
          OWNED_PACKAGES="sdk memory-client convergence core emotions"
          failures=0
          for pkg in $OWNED_PACKAGES; do
            pkg_dir="packages/$pkg"
            if [ ! -f "$pkg_dir/tsconfig.json" ]; then
              echo "::error::expected $pkg_dir/tsconfig.json to exist (Phase 0.6 invariant)"
              failures=$((failures + 1))
              continue
            fi
            if ! find "$pkg_dir/src" -type f \( -name "*.ts" -o -name "*.tsx" \) 2>/dev/null | grep -q .; then
              echo "::notice::skipping $pkg (no .ts files under src/ yet)"
              continue
            fi
            echo "::group::typecheck $pkg"
            if ! ( cd "$pkg_dir" && tsc --noEmit ); then
              failures=$((failures + 1))
              echo "::error::typecheck failed for $pkg"
            fi
            echo "::endgroup::"
          done
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures package(s) failed typecheck"
            exit 1
          fi
          echo "All owned Phase-0.6 packages typecheck cleanly."

# Brain service CI — runs the Python test suite for services/brain/.
#
# Triggered on any change under services/brain/** or to this workflow file
# itself. Other paths (mobile app, legacy/, docs/, etc.) skip this job to
# keep PRs that don't touch the brain fast.
#
# Phase 0.7 of the build plan.

name: brain-ci

on:
  push:
    branches: [main]
    paths:
      - "services/brain/**"
      - ".github/workflows/brain-ci.yml"
  pull_request:
    paths:
      - "services/brain/**"
      - ".github/workflows/brain-ci.yml"

# Cancel in-progress runs on the same PR / branch when a new commit lands.
concurrency:
  group: brain-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the version pinned in .tool-versions; 3.12 catches
        # forward-compat breakage early (e.g. the passlib `crypt` deprecation
        # warning that landed in 3.13 — better to see it in CI than in prod).
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: services/brain

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/brain/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v

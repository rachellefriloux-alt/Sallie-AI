name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
        working-directory: .

      - run: npm run prisma:generate
        working-directory: .
        env:
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
          DIRECT_URL: "postgresql://fake:fake@localhost:5432/fake"

      - run: npm run lint
        working-directory: .

      - run: npm run test
        working-directory: .

      - run: npm run build
        working-directory: .
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://qluhpkbwtykkcjshsqau.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_placeholder' }}
